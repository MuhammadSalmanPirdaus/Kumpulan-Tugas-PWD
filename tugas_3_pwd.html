<!DOCTYPE html>
<html>

<head>
    <title>Online Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .kotak {
            width: 900px;
            margin: 50px auto;
        }

        h1 {
            background-color: #4f76a8;
            color: white;
            text-align: center;
            padding: 25px;
            margin: 0;
            font-size: 28px;
        }

        .isi {
            display: flex;
        }

        table {
            width: 700px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #777;
            padding: 14px;
        }

        th {
            background-color: #5a9b55;
            color: white;
        }

        .merah {
            background-color: #d9534f;
        }

        .kuning {
            background-color: #f4df32;
        }

        .total {
            background-color: white;
            font-weight: bold;
        }

        .email {
            width: 200px;
            margin-left: 20px;
        }

        .email h3 {
            background-color: #c94b4b;
            color: white;
            text-align: center;
            padding: 12px;
            margin: 0;
        }

        .email table {
            width: 100%;
        }

        .email td {
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="kotak">

        <h1>ONLINE ORDER</h1>

        <div class="isi">

            <table>
                <tr>
                    <th>NO</th>
                    <th>Nama Barang</th>
                    <th>QTY</th>
                    <th>Harga (Rp)</th>
                </tr>

                <tr class="merah">
                    <td>1</td>
                    <td>KINGSTON 2 GB</td>
                    <td>1</td>
                    <td>45.000</td>
                </tr>

                <tr class="kuning">
                    <td>2</td>
                    <td>DEAM/COMPROY 4 GB</td>
                    <td>2</td>
                    <td>50.000</td>
                </tr>

                <tr class="merah">
                    <td>3</td>
                    <td>EXTREME 4 GB</td>
                    <td>1</td>
                    <td>60.000</td>
                </tr>

                <tr class="kuning">
                    <td>4</td>
                    <td>APACER 4GB / 2GB / 1GB</td>
                    <td>1</td>
                    <td>48.000</td>
                </tr>

                <tr class="merah">
                    <td>5</td>
                    <td>MEMORY 128 GB DDR3</td>
                    <td>1</td>
                    <td>791.000</td>
                </tr>

                <tr class="total">
                    <td colspan="2">TOTAL BAYAR</td>
                    <td>6</td>
                    <td>994.000</td>
                </tr>
            </table>

            <div class="email">

                <h3>Mail.com &nbsp;&nbsp; 15 GB</h3>

                <table>
                    <tr>
                        <td>Webmail</td>
                        <td>Yes</td>
                    </tr>

                    <tr>
                        <td>POP 3</td>
                        <td>No</td>
                    </tr>
                </table>

            </div>

        </div>

    </div>

</body>

</html>
